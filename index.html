<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>클릭 머니 게임</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f5fa;color:#222;margin:0}
main{max-width:850px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 4px 18px #0001}
input,button{font:inherit;padding:11px;border-radius:10px;margin:5px 0}input{width:100%;border:1px solid #ccd2dc}button{border:0;background:#4c56d9;color:white;cursor:pointer}button.secondary{background:#e8edf5;color:#222}button.danger{background:#c22}button:disabled{opacity:.5}
.hidden{display:none!important}.small{color:#68707e;font-size:13px}.money{font-size:38px;font-weight:800;text-align:center;margin:16px}.center{text-align:center}.coin{width:175px;height:175px;border-radius:50%;font-size:28px;font-weight:bold}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #e1e5ed;border-radius:12px;padding:12px;margin:8px 0}.notice{padding:10px;background:#edf3ff;border-radius:10px;margin:10px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e4e7ed;text-align:left;padding:8px;font-size:14px}
</style></head><body><main>
<section id="auth" class="card"><h1>💰 클릭 머니 게임</h1><p>Firebase 서버 저장 버전</p>
<div id="msg" class="notice hidden" aria-live="polite"></div><h2 id="authTitle">회원가입</h2>
<input id="nick" maxlength="20" placeholder="닉네임 (2~20자)"><input id="reason" maxlength="100" placeholder="하는 이유">
<input id="pw" type="password" placeholder="비밀번호 (6자 이상)">
<button id="authBtn">회원가입</button><button id="switch" class="secondary">로그인으로 변경</button>
<p class="small">하도윤은 개발자 닉네임으로 예약됩니다. 공개하기 전에 먼저 하도윤 계정을 만드세요.</p></section>
<section id="game" class="hidden">
<div class="card"><div class="row"><div><b id="hello"></b><div id="reasonView" class="small"></div></div><button id="logout" class="secondary">로그아웃</button></div>
<div class="center"><div id="money" class="money">0.000 KRW</div><button id="click" class="coin">CLICK</button>
<p>클릭당 <b id="rate">0.001</b> KRW · 클릭 <b id="clicks">0</b>회</p></div></div>
<div class="card"><h2>🛒 업그레이드</h2><div id="shop"></div></div>
<div class="card"><h2>💸 하도윤에게 보내기</h2><p class="small">게임 내 가상 머니입니다.</p>
<input id="amount" type="number" min="0" step="0.001" placeholder="보낼 금액"><button id="send">보내기</button><div id="sendMsg" class="small"></div></div>
<div id="dev" class="card hidden"><div class="row"><h2>🛠 개발자 화면 — 하도윤</h2><div><button id="refresh" class="secondary">새로고침</button><button id="reset" class="danger">송금 기록 초기화</button></div></div>
<h3>사용자별 보유 금액/송금 합계</h3><div id="users" class="scroll"></div><h3>송금 기록</h3><div id="transfers" class="scroll"></div></div>
</section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,deleteUser}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getDatabase,ref,get,set,remove,runTransaction,push,onValue}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAi1aCJE4qntGyVgFjN_d2oMIu6QgriDPI",
 authDomain:"zmfflr2-cb430.firebaseapp.com",
 databaseURL:"https://zmfflr2-cb430-default-rtdb.firebaseio.com",
 projectId:"zmfflr2-cb430",
 storageBucket:"zmfflr2-cb430.firebasestorage.app",
 messagingSenderId:"145603445001",
 appId:"1:145603445001:web:ea682aaaaa8c623c1f13d8",
 measurementId:"G-23EPBR8V59"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const DEV="하도윤", $=id=>document.getElementById(id);
const upgrades=[{p:200,r:20,pt:"0.2",rt:"0.02"},{p:450,r:40,pt:"0.45",rt:"0.04"},{p:1000,r:700,pt:"1",rt:"0.7"},{p:10000,r:100,pt:"10",rt:"0.1"}];
let signup=true,busy=false,authFlow=false,user=null,profile=null,unsubscribe=null,activeUid=null;
const fmt=n=>(Number(n||0)/1000).toFixed(3), nk=s=>encodeURIComponent(s.trim().toLowerCase());
function email(n){const bytes=new TextEncoder().encode(n.trim().toLowerCase());return "n"+Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("")+"@clickgame.invalid";}
function legacyEmail(n){return encodeURIComponent(n.trim().toLowerCase()).replace(/%/g,"_")+"@clickgame.local";}
async function signInCompatible(n,pw){
 let lastError=null;
 const candidates=[...new Set([email(n),legacyEmail(n)])];
 for(const candidate of candidates){
  try{return await signInWithEmailAndPassword(auth,candidate,pw);}
  catch(e){lastError=e;if(!["auth/invalid-credential","auth/user-not-found","auth/wrong-password","auth/invalid-email"].includes(e.code))throw e;}
 }
 throw lastError || new Error("로그인 정보를 확인해 주세요.");
}
function note(text,good=false){$("msg").textContent=text;$("msg").style.background=good?"#eaf8ed":"#fff0f0";$("msg").classList.remove("hidden");}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showGame(on){$("auth").classList.toggle("hidden",on);$("game").classList.toggle("hidden",!on);}
function tr(){return ref(db,"users/"+user.uid);}

$("switch").onclick=()=>{signup=!signup;$("authTitle").textContent=signup?"회원가입":"로그인";$("authBtn").textContent=signup?"회원가입":"로그인";$("switch").textContent=signup?"로그인으로 변경":"회원가입으로 변경";$("reason").classList.toggle("hidden",!signup);$("msg").classList.add("hidden");};
async function ensureProfile(authUser,nick,reason){
 const uid=authUser.uid;
 const profileRef=ref(db,"users/"+uid);
 const existing=await get(profileRef);
 if(existing.exists()){
  let old=existing.val();
  // 이전 버전의 money/perClick/upgradeLevel 구조를 새 형식으로 1회 변환합니다.
  if(old.moneyMilli===undefined){
   const migrated={
    nick:old.nick||nick,
    nickKey:old.nickKey||nk(old.nick||nick),
    reason:String(old.reason||reason||"").slice(0,100),
    role:old.role==="developer"||old.nick===DEV?"developer":"user",
    moneyMilli:Math.max(0,Math.round(Number(old.money||0)*1000)),
    rateMilli:Math.max(0,Math.round(Number(old.perClick===undefined?0.001:old.perClick)*1000)),
    level:Math.max(0,Math.min(4,Number(old.upgradeLevel||0))),
    clicks:Math.max(0,Number(old.clicks||0)),
    createdAt:Number(old.createdAt||Date.now())
   };
   await set(profileRef,migrated);
   old=migrated;
  }
  if(old.nick===DEV && old.role==="developer"){
   const dev=await get(ref(db,"developerUid"));
   if(!dev.exists())await set(ref(db,"developerUid"),uid);
  }
  return old;
 }
 const nicknameRef=ref(db,"nicknames/"+nk(nick));
 const claim=await runTransaction(nicknameRef,old=>old===null?uid:old);
 if(!claim.committed || claim.snapshot.val()!==uid)throw Error("이미 사용 중인 닉네임입니다.");
 let role="user";
 if(nick===DEV){
  const dev=await get(ref(db,"developerUid"));
  if(dev.exists() && dev.val()!==uid)throw Error("하도윤 개발자 계정은 이미 예약되어 있습니다.");
  role="developer";
 }
 const doc={nick,nickKey:nk(nick),reason:(reason||"").slice(0,100),role,moneyMilli:0,rateMilli:1,level:0,clicks:0,createdAt:Date.now()};
 await set(profileRef,doc);
 if(role==="developer")await set(ref(db,"developerUid"),uid);
 return doc;
}

$("authBtn").onclick=async()=>{
 if(busy)return;
 const nick=$("nick").value.trim(),reason=$("reason").value.trim(),pw=$("pw").value;
 if(!/^[가-힣A-Za-z0-9_-]{2,20}$/.test(nick))return note("닉네임은 한글·영문·숫자·_·-로 2~20자 입력하세요.");
 if(pw.length<6)return note("비밀번호는 6자 이상이어야 합니다.");
 busy=true;authFlow=true;$("authBtn").disabled=true;
 try{
  let credential;
  if(signup){
   // 구버전에서 생성한 내부 이메일도 먼저 확인해 기존 계정을 복구합니다.
   try{
    credential=await signInCompatible(nick,pw);
   }catch(e){
    if(!["auth/invalid-credential","auth/user-not-found","auth/wrong-password","auth/invalid-email"].includes(e.code))throw e;
    try{credential=await createUserWithEmailAndPassword(auth,email(nick),pw);}
    catch(createError){
     if(createError.code==="auth/email-already-in-use")credential=await signInCompatible(nick,pw);
     else throw createError;
    }
   }
  }else{
   credential=await signInCompatible(nick,pw);
  }
  await ensureProfile(credential.user,nick,reason);
  user=credential.user;
  await startUser(credential.user);
  if(signup)note("회원가입/계정 확인 완료!",true);
 }catch(e){
  console.error(e);
  let m=e.message||e.code||"오류가 발생했습니다.";
  if(e.code==="auth/email-already-in-use")m="이 닉네임의 인증 계정이 이미 있습니다. 같은 비밀번호로 다시 시도하거나 Firebase Authentication의 사용자 목록에서 실패한 테스트 계정을 정리하세요.";
  else if(["auth/invalid-credential","auth/user-not-found","auth/wrong-password"].includes(e.code))m="닉네임 또는 비밀번호가 맞지 않습니다. 예전 버전에서 가입했다면 회원가입 버튼으로 같은 닉네임/비밀번호를 입력해 계정 복구를 시도하세요.";
  else if(e.code==="auth/operation-not-allowed")m="Firebase 설정에서 Authentication → 로그인 방법 → 이메일/비밀번호를 사용 설정해야 합니다.";
  else if(e.code==="auth/invalid-email")m="Firebase 인증에서 내부 이메일 형식을 거부했습니다. 최신 ZIP의 index.html을 사용하고 Authentication 설정을 확인하세요.";
  else if(e.code==="auth/weak-password")m="비밀번호는 6자 이상으로 입력하세요.";
  else if(e.code==="auth/too-many-requests")m="시도가 너무 많습니다. 잠시 기다렸다가 다시 시도하세요.";
  else if(/PERMISSION_DENIED|permission_denied|Permission denied/i.test(m))m="Realtime Database 규칙이 저장되지 않았거나 로그인 권한이 없습니다. ZIP의 firebase-rules.json을 규칙 탭에 붙여넣고 게시했는지 확인하세요.";
  note(m);
 }finally{
  authFlow=false;busy=false;$("authBtn").disabled=false;
 }
};
$("logout").onclick=()=>signOut(auth);
$("click").onclick=async()=>{
 if(!user||busy)return;busy=true;
 try{const r=await runTransaction(tr(),u=>{if(!u)return u;u.moneyMilli=Number(u.moneyMilli||0)+Number(u.rateMilli||1);u.clicks=Number(u.clicks||0)+1;return u;});if(!r.committed)throw Error("클릭 저장이 거부됐습니다.");}
 catch(e){$("sendMsg").textContent="저장 실패: "+e.message;}finally{busy=false;}
};
function renderShop(){
 $("shop").innerHTML="";const level=Number(profile?.level||0);
 upgrades.forEach((x,i)=>{const row=document.createElement("div");row.className="item";const left=document.createElement("div");left.innerHTML="<b>"+(i+1)+"단계</b><br><span class='small'>가격 "+x.pt+" KRW → 클릭당 "+x.rt+" KRW</span>";
 const b=document.createElement("button");b.textContent=level>i?"구매 완료":level===i?"구매":"잠김";b.disabled=level!==i;
 b.onclick=async()=>{if(busy)return;busy=true;try{const r=await runTransaction(tr(),u=>{if(!u||Number(u.level||0)!==i||Number(u.moneyMilli||0)<x.p)return;u.moneyMilli-=x.p;u.rateMilli=x.r;u.level=i+1;return u;});if(!r.committed)$("sendMsg").textContent="돈이 부족하거나 이미 구매했습니다.";}catch(e){$("sendMsg").textContent="업그레이드 저장 실패: "+e.message;}finally{busy=false;}};
 row.append(left,b);$("shop").append(row);});
}
$("send").onclick=async()=>{
 if(!user||busy)return;const v=Number($("amount").value);
 if(!Number.isFinite(v)||v<=0)return $("sendMsg").textContent="금액을 올바르게 입력하세요.";
 if(profile?.role==="developer")return $("sendMsg").textContent="개발자 계정에서는 보낼 수 없습니다.";
 const amount=Math.round(v*1000);if(Math.abs(v*1000-amount)>1e-6)return $("sendMsg").textContent="소수점 셋째 자리까지 입력하세요.";
 busy=true;$("send").disabled=true;
 try{
  const r=await runTransaction(tr(),u=>{if(!u||Number(u.moneyMilli||0)<amount)return;u.moneyMilli-=amount;return u;});
  if(!r.committed)throw Error("보유 금액이 부족합니다.");
  await set(push(ref(db,"transfers")),{uid:user.uid,nick:profile.nick,amountMilli:amount,createdAt:Date.now()});
  $("amount").value="";$("sendMsg").textContent=fmt(amount)+" KRW를 하도윤에게 보냈습니다.";
 }catch(e){$("sendMsg").textContent="송금 저장 실패: "+e.message;}finally{busy=false;$("send").disabled=false;}
};
async function loadDev(){
 if(profile?.role!=="developer"){$("dev").classList.add("hidden");return;}
 $("dev").classList.remove("hidden");
 try{
  const us=(await get(ref(db,"users"))).val()||{},ts=(await get(ref(db,"transfers"))).val()||{},totals={};
  const arr=Object.values(ts).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
  arr.forEach(t=>totals[t.uid]=(totals[t.uid]||0)+Number(t.amountMilli||0));
  let a="<table><tr><th>닉네임</th><th>보유 금액</th><th>클릭</th><th>송금 합계</th><th>하는 이유</th></tr>";
  Object.entries(us).forEach(([uid,u])=>a+="<tr><td>"+esc(u.nick)+(u.role==="developer"?" ★":"")+"</td><td>"+fmt(u.moneyMilli)+"</td><td>"+Number(u.clicks||0)+"</td><td>"+fmt(totals[uid]||0)+"</td><td>"+esc(u.reason)+"</td></tr>");
  $("users").innerHTML=a+"</table>";
  if(!arr.length){$("transfers").innerHTML="<p>송금 기록이 없습니다.</p>";return;}
  let t="<table><tr><th>닉네임</th><th>금액</th><th>시간</th></tr>";
  arr.forEach(x=>t+="<tr><td>"+esc(x.nick)+"</td><td>"+fmt(x.amountMilli)+" KRW</td><td>"+new Date(x.createdAt).toLocaleString("ko-KR")+"</td></tr>");
  $("transfers").innerHTML=t+"</table>";
 }catch(e){$("users").textContent="조회 실패: "+e.message;}
}
$("refresh").onclick=loadDev;
$("reset").onclick=async()=>{if(!confirm("송금 기록을 모두 초기화할까요?"))return;try{await remove(ref(db,"transfers"));await loadDev();}catch(e){$("transfers").textContent="초기화 실패: "+e.message;}};
async function startUser(u){
 const uid=u?.uid||null;
 if(uid && uid===activeUid && profile)return;
 user=u;
 if(!u){
  activeUid=null;
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  profile=null;showGame(false);return;
 }
 try{
  const s=await get(ref(db,"users/"+u.uid));
  if(!s.exists()){
   note("계정 인증은 됐지만 게임 프로필을 아직 저장하지 못했습니다. 같은 닉네임/비밀번호로 다시 시도해 복구하거나 데이터베이스 규칙을 확인하세요.");
   showGame(false);return;
  }
  activeUid=u.uid;showGame(true);
  if(unsubscribe)unsubscribe();
  unsubscribe=onValue(ref(db,"users/"+u.uid),snap=>{
   profile=snap.val();if(!profile)return;
   $("hello").textContent=profile.nick+"님"+(profile.role==="developer"?" (개발자)":"");
   $("reasonView").textContent=profile.reason?"하는 이유: "+profile.reason:"";
   $("money").textContent=fmt(profile.moneyMilli)+" KRW";$("rate").textContent=fmt(profile.rateMilli);$("clicks").textContent=Number(profile.clicks||0);
   renderShop();loadDev();
  },err=>{$("sendMsg").textContent="불러오기 실패: "+err.message;});
 }catch(e){note("계정 정보를 불러오지 못했습니다: "+e.message);showGame(false);}
}
onAuthStateChanged(auth,async u=>{
 // 회원가입 직후 프로필이 DB에 기록될 때까지 감시 콜백을 잠시 막아 조기 로그아웃을 방지합니다.
 if(authFlow)return;
 await startUser(u);
});
</script></body></html>
