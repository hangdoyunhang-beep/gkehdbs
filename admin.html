<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>클릭 머니 게임 관리자</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f5fa;color:#222;margin:0}main{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 4px 18px #0001}input,button{font:inherit;padding:11px;border-radius:10px;margin:5px 0}input{width:100%;border:1px solid #ccd2dc}button{border:0;background:#4c56d9;color:white;cursor:pointer}.danger{background:#c22}.secondary{background:#e8edf5;color:#222}.hidden{display:none!important}.small{color:#68707e;font-size:13px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e4e7ed;text-align:left;padding:8px;font-size:14px}.notice{padding:10px;background:#edf3ff;border-radius:10px;margin:10px 0}
</style></head><body><main>
<section id="login" class="card"><h1>🛠 클릭 머니 게임 관리자</h1><p>개발자 계정(하도윤)으로 로그인하세요.</p><input id="nick" maxlength="20" placeholder="개발자 닉네임"><input id="pw" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button><div id="msg" class="notice" aria-live="polite"></div></section>
<section id="panel" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>관리자 화면</h2><button id="logout" class="secondary">로그아웃</button></div><p class="small">게임 진행도 초기화는 계정과 닉네임을 삭제하지 않습니다. 초기화 전에 신중히 확인하세요.</p><button id="refresh">목록 새로고침</button> <button id="resetProgress" class="danger">전체 유저 게임 진행도 초기화</button> <button id="resetTransfers" class="danger">송금 기록 초기화</button><div id="status" class="notice"></div></div>
<div class="card"><h3>사용자 목록</h3><div id="users" class="scroll"></div></div><div class="card"><h3>송금 기록</h3><div id="transfers" class="scroll"></div></div></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getDatabase,ref,get,update,remove} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAi1aCJE4qntGyVgFjN_d2oMIu6QgriDPI",authDomain:"zmfflr2-cb430.firebaseapp.com",databaseURL:"https://zmfflr2-cb430-default-rtdb.firebaseio.com",projectId:"zmfflr2-cb430",storageBucket:"zmfflr2-cb430.firebasestorage.app",messagingSenderId:"145603445001",appId:"1:145603445001:web:ea682aaaaa8c623c1f13d8",measurementId:"G-23EPBR8V59"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);let allowed=false;
const email=n=>{const bytes=new TextEncoder().encode(n.trim().toLowerCase());return "n"+Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("")+"@clickgame.invalid"};
const legacyEmail=n=>encodeURIComponent(n.trim().toLowerCase()).replace(/%/g,"_")+"@clickgame.local";
function fmt(n){return (Number(n||0)/1000).toFixed(3)}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(t){$('msg').textContent=t;$('status').textContent=t}
$('loginBtn').onclick=async()=>{try{const nick=$('nick').value.trim(),pw=$('pw').value;if(!nick||!pw)throw Error('닉네임과 비밀번호를 입력하세요.');let err;for(const em of [...new Set([email(nick),legacyEmail(nick)])]){try{await signInWithEmailAndPassword(auth,em,pw);return}catch(e){err=e;if(!['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-email'].includes(e.code))throw e}}throw err}catch(e){say('로그인 실패: '+(e.message||e.code))}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{allowed=false;if(!u){$('login').classList.remove('hidden');$('panel').classList.add('hidden');return}try{const [us,dev]=await Promise.all([get(ref(db,'users/'+u.uid)),get(ref(db,'developerUid'))]);const profile=us.val();if(!(dev.val()===u.uid||(profile&&profile.role==='developer'&&profile.nick==='하도윤'))){say('개발자 계정이 아닙니다.');await signOut(auth);return}allowed=true;$('login').classList.add('hidden');$('panel').classList.remove('hidden');say('개발자 로그인 완료');await load()}catch(e){say('권한 확인 실패: '+e.message);await signOut(auth)}});
async function load(){if(!allowed)return;try{const [us,ts]=await Promise.all([get(ref(db,'users')),get(ref(db,'transfers'))]);const users=us.val()||{},transfers=ts.val()||{},totals={};const arr=Object.values(transfers).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));arr.forEach(t=>totals[t.uid]=(totals[t.uid]||0)+Number(t.amountMilli||0));let h='<table><tr><th>닉네임</th><th>보유 금액</th><th>클릭</th><th>단계</th><th>송금 합계</th><th>하는 이유</th></tr>';for(const [uid,u] of Object.entries(users))h+=`<tr><td>${esc(u.nick)}${u.role==='developer'?' ★':''}</td><td>${fmt(u.moneyMilli)}원</td><td>${Number(u.clicks||0)}</td><td>${Number(u.level||0)}</td><td>${fmt(totals[uid]||0)}원</td><td>${esc(u.reason)}</td></tr>`;$('users').innerHTML=h+'</table>';if(!arr.length)$('transfers').innerHTML='<p>송금 기록이 없습니다.</p>';else{$('transfers').innerHTML='<table><tr><th>닉네임</th><th>금액</th><th>시간</th></tr>'+arr.map(t=>`<tr><td>${esc(t.nick)}</td><td>${fmt(t.amountMilli)}원</td><td>${new Date(Number(t.createdAt||0)).toLocaleString('ko-KR')}</td></tr>`).join('')+'</table>'}$('status').textContent=`사용자 ${Object.keys(users).length}명 · 송금 기록 ${arr.length}건`;}catch(e){$('status').textContent='불러오기 실패: '+e.message}}
$('refresh').onclick=load;
$('resetProgress').onclick=async()=>{if(!allowed||!confirm('모든 사용자의 게임 진행도를 초기화할까요? 보유 금액, 클릭 수, 업그레이드 단계가 초기화됩니다. 계정과 닉네임은 유지됩니다.'))return;try{const s=await get(ref(db,'users'));const vals=s.val()||{},changes={};for(const [uid,u] of Object.entries(vals)){changes[`users/${uid}/moneyMilli`]=0;changes[`users/${uid}/rateMilli`]=1;changes[`users/${uid}/level`]=0;changes[`users/${uid}/clicks`]=0;}await update(ref(db),changes);$('status').textContent='게임 진행도를 초기화했습니다. 계정은 유지됩니다.';await load()}catch(e){$('status').textContent='초기화 실패: '+e.message}};
$('resetTransfers').onclick=async()=>{if(!allowed||!confirm('모든 송금 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.'))return;try{await remove(ref(db,'transfers'));$('status').textContent='송금 기록을 초기화했습니다.';await load()}catch(e){$('status').textContent='초기화 실패: '+e.message}};
</script></body></html>
